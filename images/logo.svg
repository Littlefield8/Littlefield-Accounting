<svg width="157" height="38" viewBox="86 46 314 76" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(90, 20)">
    <!-- Bar chart graphic - 2 vertical bars + horizontal base (gap between bars and base) -->
    <g fill="#1E9E44">
      <!-- Short bar: right edge aligns with horizontal bar -->
      <rect x="8" y="43" width="20" height="31" rx="2"/>
      <!-- Tall bar: right edge aligns with horizontal bar -->
      <rect x="34" y="26" width="20" height="48" rx="2"/>
      <!-- Horizontal base bar -->
      <rect x="-4" y="82" width="58" height="20" rx="2"/>
    </g>
    <!-- Text block: centered vertically across from all 3 bars -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="68" y="74" font-size="40" font-weight="700" fill="#262626">Littlefield</text>
      <text x="155" y="99" font-size="20" font-weight="400" fill="#1E9E44" letter-spacing="1" text-anchor="middle">ACCOUNTING</text>
    </g>
  </g>
</svg>
